<!DOCTYPE html>
<html>

<head>
    <title>My Tasks</title>
</head>

<body>

    <h2>My Tasks</h2>

    <p>
        <a href="{% url 'create_task' %}">Create New Task</a> |
        <a href="{% url 'dashboard' %}">Dashboard</a> |
        <a href="{% url 'student_logout' %}">Logout</a>
    </p>

    <hr>

    {% for task in tasks %}

    <h3>{{ task.title }}</h3>

    <p>{{ task.description }}</p>

    <p>
        Created: {{ task.created_at }}
    </p>

    <p>
        <a href="{% url 'update_task' task.id %}">
            <button type="button">Update</button>
        </a>
    </p>

    <hr>


    {% empty %}

    <p>No tasks found.</p>

    {% endfor %}

</body>

</html>
