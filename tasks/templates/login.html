{% extends 'base.html' %}

{% block title %}Login - Student Task Management System{% endblock %}

{% block extra_css %}
<style>
    .auth-card {
        max-width: 420px;
        margin: 3rem auto;
        background: #ffffff;
        padding: 2.5rem;
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
    }
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .auth-header i {
        font-size: 2.5rem;
        color: var(--primary);
        margin-bottom: 0.5rem;
    }
    .auth-header h2 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--dark);
    }
    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: var(--text-muted);
    }
    .auth-footer a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
    }
    .auth-footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <i class="fa-solid fa-lock"></i>
        <h2>Student Login</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Enter your credentials to access your tasks</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control"
                   placeholder="Enter your username"
                   required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 0.5rem;">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a href="{% url 'register' %}">Register here</a>
    </div>
</div>
{% endblock %}
