{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task - Student Task System</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container" style="max-width: 550px;">
        <div class="card">
            <h1>Update Task</h1>
            <p>Modify details for this task item.</p>

            <form method="POST">
                {% csrf_token %}

                <div>
                    <label>Task Title</label>
                    <input type="text" name="title" value="{{ task.title }}" required>
                </div>

                <div>
                    <label>Description</label>
                    <textarea name="description" rows="4">{{ task.description }}</textarea>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit">Update Task</button>
                    <a href="{% url 'view_tasks' %}" style="display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem 1.5rem; border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--card-border);">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
