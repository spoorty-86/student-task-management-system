<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>

<h1>Student Registration</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <br><br>

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <button type="submit">Register</button>
</form>

<p>Already have an account? <a href="{% url 'student_login' %}">Login here</a></p>

{% for message in messages %}
    <p>{{ message }}</p>
{% endfor %}


</body>
</html>
