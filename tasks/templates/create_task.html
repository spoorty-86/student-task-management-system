{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task - Student Task System</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container" style="max-width: 550px;">
        <div class="card">
            <h1>Create New Task</h1>
            <p>Add details for your new task assignment.</p>

            {% if error %}
                <div class="message" style="border-color: rgba(239, 68, 68, 0.4); color: #fca5a5;">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div>
                    <label>Task Title</label>
                    <input type="text" name="title" placeholder="Enter task title" required>
                </div>

                <div>
                    <label>Task Description</label>
                    <textarea name="description" placeholder="Enter detailed task description" rows="4"></textarea>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit">Create Task</button>
                    <a href="{% url 'view_tasks' %}" style="display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem 1.5rem; border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--card-border);">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
