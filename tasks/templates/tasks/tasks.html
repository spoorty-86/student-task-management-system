<!DOCTYPE html>
<html>
<head>
    <title>View Tasks</title>
</head>

<body>

    <h2>My Tasks</h2>

    <p>
        <a href="{% url 'create_task' %}">Create New Task</a> |
        <a href="{% url 'dashboard' %}">Dashboard</a> |
        <a href="{% url 'student_logout' %}">Logout</a>
    </p>

    <hr>

    {% if tasks %}

        {% for task in tasks %}

            <div>
                <h3>{{ task.title }}</h3>

                <p>{{ task.description }}</p>

                <p>
                    Created: {{ task.created_at }}
                </p>

                <div style="display: flex; gap: 10px; align-items: center; margin-top: 10px;">
                    <a href="{% url 'update_task' task.id %}">
                        <button type="button">Update</button>
                    </a>

                    <form method="POST"
                          action="{% url 'delete_task' task.id %}"
                          onsubmit="return confirm('Are you sure you want to delete this task?');"
                          style="display: inline; margin: 0;">

                        {% csrf_token %}

                        <button type="submit">
                            Delete
                        </button>

                    </form>
                </div>
            </div>

            <hr>

        {% endfor %}

    {% else %}

        <p>No tasks available. <a href="{% url 'create_task' %}">Create a task here</a>.</p>

    {% endif %}

</body>
</html>
